name: CI build checker

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

jobs:
  build:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set UP JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          architecture: x64

  gradle-build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set UP JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          architecture: x64
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@e6e38bacfdf1a337459f332974bb2327a31aaf4b

      - name: App Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: -S -i --parallel clean build -x test
          gradle-version: 8.1

  gradle-test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set UP JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          architecture: x64
      - name: App Testing
        uses: gradle/gradle-build-action@v2
        with:
          arguments: -S -i --parallel test
          gradle-version: 8.1

  mutation-test:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set UP JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          architecture: x64
      - name: Mutation Testing Analysis
        uses: gradle/gradle-build-action@v2
        with:
          arguments: -S -i --parallel pitest
          gradle-version: 8.1

  code-coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set UP JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          architecture: x64
      - name: Code Coverage Analysis
        uses: gradle/gradle-build-action@v2
        with:
          arguments: -S -i --parallel test jacocoTestReport
          gradle-version: 8.1
